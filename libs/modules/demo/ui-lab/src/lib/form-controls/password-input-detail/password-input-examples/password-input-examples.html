<div class="fc-examples">

  <!-- Scenario 1: Basic -->
  <ui-lab-scenario-card
    [title]="'UI_LAB_SCENE_PASSWORD_BASIC_TITLE' | translate"
    [description]="'UI_LAB_SCENE_PASSWORD_BASIC_DESC' | translate"
  >
    <div class="fc-demo-field">
      <aum-password-input
        label="Password"
        placeholder="Enter password"
        [data]="password()"
        (dataChange)="password.set($event)"
      ></aum-password-input>
      <p class="fc-output">Length: <strong>{{ password().length }}</strong></p>
    </div>
  </ui-lab-scenario-card>

  <!-- Scenario 2: Validation -->
  <ui-lab-scenario-card
    [title]="'UI_LAB_SCENE_PASSWORD_VALIDATION_TITLE' | translate"
    [description]="'UI_LAB_SCENE_PASSWORD_VALIDATION_DESC' | translate"
  >
    <div class="fc-demo-field">
      <aum-password-input
        label="Password"
        placeholder="Min 8 characters"
        [required]="true"
        [control]="passwordControl"
        [customErrorMessages]="{ minlength: 'Use at least 8 characters.' }"
      ></aum-password-input>
    </div>
  </ui-lab-scenario-card>

  <!-- Scenario 3: Disabled & Readonly -->
  <ui-lab-scenario-card
    [title]="'UI_LAB_SCENE_PASSWORD_STATES_TITLE' | translate"
    [description]="'UI_LAB_SCENE_PASSWORD_STATES_DESC' | translate"
  >
    <div class="fc-demo-column">
      <aum-password-input label="Disabled" [disabled]="true"></aum-password-input>
      <aum-password-input label="Readonly" [readonly]="true" data="secret"></aum-password-input>
    </div>
  </ui-lab-scenario-card>

  <!-- Scenario 4: Size & Label Weight -->
  <ui-lab-scenario-card
    [title]="'UI_LAB_SCENE_INPUT_SIZE_TITLE' | translate"
    [description]="'UI_LAB_SCENE_INPUT_SIZE_DESC' | translate"
  >
    <div class="fc-size-demo">
      <div class="fc-size-controls">
        <aum-slide-toggle
          label="Bold Label"
          [checked]="boldLabel()"
          (checkedChange)="boldLabel.set($event)"
        ></aum-slide-toggle>
        <aum-slide-toggle
          label="Large Size"
          [checked]="size() === 'large'"
          (checkedChange)="size.set($event ? 'large' : 'medium')"
        ></aum-slide-toggle>
      </div>
      <div class="fc-demo-field">
        <aum-password-input
          label="Password"
          placeholder="Enter password"
          [boldLabel]="boldLabel()"
          [size]="size()"
        ></aum-password-input>
      </div>
    </div>
  </ui-lab-scenario-card>

</div>
